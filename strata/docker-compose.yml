version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"

  frontend:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ./frontend:/site
    ports:
      - "8080:8080"
    command: ["python", "-m", "http.server", "8080"]
    depends_on:
      - backend
